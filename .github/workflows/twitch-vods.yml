name: Update Twitch replay links

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-vods:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest replays from Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHANNEL: comedyhub
        run: node scripts/fetch-vods.mjs

      - name: Commit vods.json if it changed
        run: |
          if git diff --quiet -- vods.json; then
            echo "No change to vods.json - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vods.json
          git commit -m "Update Twitch replay links"
          git push
