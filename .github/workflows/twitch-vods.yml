name: Update Twitch replay links

# Regenerates vods.json so each show on comedyhublive.com links to its most
# recent Twitch replay. Twitch keeps past broadcasts 60 days on this channel,
# so refreshing a few times a day is plenty.

on:
  schedule:
    # 06:00, 12:00, 18:00 and 00:00 UTC. GitHub runs cron in UTC only.
    - cron: '0 0,6,12,18 * * *'
  push:
    # Rebuild the share pages whenever the schedule itself changes, so a
    # new showtime is reflected in its social preview straight away.
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

# Required so the job can commit vods.json back to the repo.
permissions:
  contents: write

jobs:
  update-vods:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest replays from Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHANNEL: comedyhub
        run: node scripts/fetch-vods.mjs

      - name: Rebuild per-show share pages from index.html
        run: node scripts/build-share-pages.mjs

      - name: Commit anything that changed
        run: |
          git add -A vods.json s
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit needed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update replay links and share pages"
          git push

  # Tripwire: fails (and GitHub emails you) if a Zoom or bit.ly link ever
  # lands in a file the site serves. Zoom links belong in Firestore
  # (private/zoomLinks), never in this public repo.
  no-zoom-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Make sure no Zoom or bit.ly links are published
        run: |
          if grep -rnIE "zoom\.us/[jw]/|bit\.ly/" --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::A Zoom or bit.ly link is in a published file. Move it to Firestore (private/zoomLinks) and remove it from the repo."
            exit 1
          fi
          echo "No Zoom or bit.ly links in published files."
